# Dependabot proposes version updates as pull requests, which run the full CI checks before merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      api-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /infra/local
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /infra/aws
      - /infra/bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
